name: Test selezione e assemblaggio incrementale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-incremental-recalls.yml"
      - "scripts/select_pending_recalls.mjs"
      - "scripts/assemble_incremental_recalls.py"
      - "scripts/isolate_new_image_quality.py"
      - ".github/workflows/update.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila ed esegui test selezione RSS
        run: |
          node --check scripts/select_pending_recalls.mjs
          node scripts/select_pending_recalls.mjs --self-test
      - name: Compila ed esegui test aggregazione sicura
        run: |
          python -m py_compile scripts/assemble_incremental_recalls.py
          python scripts/assemble_incremental_recalls.py --self-test
          python -m py_compile scripts/isolate_new_image_quality.py
          python scripts/isolate_new_image_quality.py --self-test
      - name: Simula feed corrente con DB reale senza toccarlo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('recalls.json').read_text(encoding='utf-8'))
          assert len(data.get('recalls', []))>=10
          sample=data['recalls'][:4]
          assert sample[0]['immagine'] and sample[1]['motivo']
          feed=[{'id':x['id']} for x in sample]
          generated={**data, 'recalls':[]}
          import subprocess
          from scripts.assemble_incremental_recalls import assemble
          out=assemble(data,generated,feed)
          assert out['recalls']==sample
          assert out['recalls'][0]['immagine']==sample[0]['immagine']
          print('PASS: righe e immagini reali preservate')
          PY
      - name: Verifica sintassi ed estrazione degli script effettivi del workflow
        run: |
          python -m pip install PyYAML --quiet
          python - <<'PY'
          import pathlib, yaml
          p=pathlib.Path(".github/workflows/update.yml")
          s=p.read_text(encoding="utf-8")
          yaml.safe_load(s)
          needle="cat > acquisisci.mjs <<'EOF'\n"
          assert s.count(needle)==1
          part=s.split(needle,1)[1].split("\n          EOF",1)[0]
          js="\n".join(line[10:] if line.startswith("          ") else line for line in part.splitlines())
          pathlib.Path("/tmp/acquisisci.mjs").write_text(js,encoding="utf-8")
          needle="cat > estrai.py <<'PYEOF'\n"
          assert s.count(needle)==1
          part=s.split(needle,1)[1].split("\n          PYEOF",1)[0]
          py="\n".join(line[10:] if line.startswith("          ") else line for line in part.splitlines())
          pathlib.Path("/tmp/estrai.py").write_text(py,encoding="utf-8")
          assert "12 * 60 * 60" not in s and "RECHECK_ALL" not in s
          assert "assemble_incremental_recalls.py" in s
          assert "isolate_new_image_quality.py prepare" in s
          assert "isolate_new_image_quality.py complete" in s
          assert "node acquisisci.mjs" in s
          assert "scripts/merge_generated_recalls.py" in s
          print("PASS: sintassi YAML e politica solo nuovi richiami")
          PY
          node --check /tmp/acquisisci.mjs
          python -m py_compile /tmp/estrai.py
