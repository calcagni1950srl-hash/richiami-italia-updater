name: Avvio Richiami Italia ogni 30 minuti

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  avvia-aggiornamento:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia workflow principale
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/update.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}'
          echo "Workflow principale avviato."
