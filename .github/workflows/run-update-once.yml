name: Avvia updater una volta

on:
  push:
    paths:
      - ".github/workflows/run-update-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia updater
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches"             -d '{"ref":"main"}'
          echo "✅ Updater avviato"
