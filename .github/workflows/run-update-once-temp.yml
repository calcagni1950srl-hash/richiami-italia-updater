name: Avvia test completo richiami una volta

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-update-once-temp.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia updater principale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calcagni1950srl-hash/richiami-italia-updater/actions/workflows/update.yml/dispatches \
            -d '{"ref":"main"}'
          echo "✅ Updater principale avviato"
