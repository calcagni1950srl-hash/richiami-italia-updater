name: Avvia test completo una tantum

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-full-test-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia aggiornamento completo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST             -H "Accept: application/vnd.github+json"             /repos/${{ github.repository }}/actions/workflows/update.yml/dispatches             -f ref=main
          echo "Aggiornamento completo avviato."
