name: Pubblica foto salame complete - temporaneo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-salame-full-temp.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Scarica artifact del test verificato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/salame-artifact
          gh api \
            repos/${{ github.repository }}/actions/artifacts/10700045744/zip \
            > /tmp/salame-artifact.zip
          unzip -q /tmp/salame-artifact.zip -d /tmp/salame-artifact
          find /tmp/salame-artifact -maxdepth 3 -type f -print

      - name: Pubblica esattamente le due foto verificate
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from PIL import Image

          mapping = {
              "salame-stagionato-al-trtufo": "salame-stagionato-al-trtufo-70de4a0e3e.png",
              "salame-stagionato-al-tartufo": "salame-stagionato-al-tartufo-5b2f73561b.png",
          }

          root = Path("/tmp/salame-artifact")
          images = Path("images")
          images.mkdir(exist_ok=True)

          data = json.loads(Path("recalls.json").read_text(encoding="utf-8"))

          for rid, filename in mapping.items():
              matches = list(root.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f"Artifact: atteso 1 file {filename}, trovati {len(matches)}")
              src = matches[0]
              dst = images / filename
              shutil.copy2(src, dst)

              im = Image.open(dst).convert("RGB")
              w, h = im.size
              if w < 250 or h < 350:
                  raise SystemExit(f"Dimensioni sospette {rid}: {w}x{h}")

              found = False
              for item in data.get("recalls", []):
                  if item.get("id") == rid:
                      item["immagine"] = (
                          "https://raw.githubusercontent.com/"
                          "calcagni1950srl-hash/richiami-italia-updater/"
                          f"refs/heads/main/images/{filename}"
                      )
                      found = True
                      break
              if not found:
                  raise SystemExit(f"Richiamo non trovato: {rid}")
              print("OK", rid, filename, w, h)

          Path("recalls.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit e push
        run: |
          git config user.name "Richiami Italia Image Bot"
          git config user.email "actions@github.com"
          git add recalls.json
          git add -f images/salame-stagionato-al-trtufo-70de4a0e3e.png
          git add -f images/salame-stagionato-al-tartufo-5b2f73561b.png
          git commit -m "Pubblica foto salame intere verificate"
          git pull --rebase origin main
          git push
