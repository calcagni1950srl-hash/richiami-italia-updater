name: Ripristina foto Brie Tour De Marze

on:
  push:
    paths:
      - ".github/workflows/add-brie-photo.yml"

permissions:
  contents: write

jobs:
  add-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica e prepara foto prodotto
        run: |
          python -m pip install --quiet pillow
          curl -L --fail --retry 3 --retry-delay 2             "https://cdn.shopify.com/s/files/1/0555/5820/9726/files/brie-tour-de-marze-3kg-wheel-cheese-wedges-371.webp"             -o /tmp/brie-tour-de-marze.webp

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          src = Path("/tmp/brie-tour-de-marze.webp")
          image = Image.open(src).convert("RGB")
          image.thumbnail((1400, 1400))
          tmp = Path("/tmp/brie-tour-de-marze.png")
          image.save(tmp, "PNG", optimize=True)

          digest = hashlib.sha256(tmp.read_bytes()).hexdigest()[:10]
          Path("/tmp/brie-filename.txt").write_text(
              f"brie-tour-de-marze-{digest}.png",
              encoding="utf-8"
          )
          print("Foto pronta:", image.size, digest)
          PY

      - name: Pubblica foto sullo stato più recente
        run: |
          set -e
          git config user.name "Richiami Italia Photo Bot"
          git config user.email "actions@github.com"

          for tentativo in 1 2 3 4; do
            echo "Tentativo pubblicazione $tentativo/4"
            git fetch origin main
            git reset --hard origin/main

            filename="$(cat /tmp/brie-filename.txt)"
            mkdir -p images
            cp /tmp/brie-tour-de-marze.png "images/$filename"

            PHOTO_FILENAME="$filename" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("recalls.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          filename = os.environ["PHOTO_FILENAME"]
          found = False

          for item in data.get("recalls", []):
              if str(item.get("id", "")).strip() == "brie-tour-de-marze":
                  item["immagine"] = (
                      "https://raw.githubusercontent.com/"
                      "calcagni1950srl-hash/richiami-italia-updater/"
                      "refs/heads/main/images/" + filename
                  )
                  notes = [
                      str(x) for x in (item.get("note", []) or [])
                      if "Foto prodotto non individuata" not in str(x)
                  ]
                  marker = "Foto prodotto di catalogo: Brie Tour de Marze 3 kg"
                  if marker not in notes:
                      notes.append(marker)
                  item["note"] = notes
                  found = True
                  break

          if not found:
              raise SystemExit("Richiamo brie-tour-de-marze non trovato")

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

            git add recalls.json "images/$filename"
            if git diff --cached --quiet; then
              echo "Foto già presente."
              exit 0
            fi

            git commit -m "Aggiunge foto Brie Tour De Marze"
            if git push origin main; then
              exit 0
            fi

            echo "Conflitto remoto, riprovo sul main aggiornato."
            sleep 4
          done

          exit 1
