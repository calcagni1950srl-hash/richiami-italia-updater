name: Pubblica foto nuovi richiami - riparazione temporanea

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-four-images-temp.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica artifact del run che contiene le 4 foto
        uses: actions/download-artifact@v4
        with:
          name: recalls-json
          path: artifact
          run-id: 35612635119
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica le quattro foto estratte
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          ids = [
              'mais-pop-corn-2',
              'mais-italiano-pop-corn',
              'mais-italiano-pop-corn-0',
              'mais-pop-corn-3',
          ]

          recalls_path = Path('recalls.json')
          data = json.loads(recalls_path.read_text(encoding='utf-8'))
          by_id = {
              str(x.get('id', '') or '').strip(): x
              for x in data.get('recalls', [])
          }

          src_dir = Path('artifact/output/images')
          dst_dir = Path('images')
          dst_dir.mkdir(parents=True, exist_ok=True)
          raw_base = (
              'https://raw.githubusercontent.com/'
              'calcagni1950srl-hash/richiami-italia-updater/'
              'refs/heads/main/images'
          )

          done = []
          for rid in ids:
              item = by_id.get(rid)
              if item is None:
                  raise SystemExit(f'Richiamo non trovato: {rid}')

              src = src_dir / f'{rid}.png'
              if not src.exists() or src.stat().st_size < 10_000:
                  raise SystemExit(f'Foto mancante/non valida nell artifact: {rid}')

              digest = hashlib.sha256(src.read_bytes()).hexdigest()[:10]
              filename = f'{rid}-{digest}.png'
              shutil.copy2(src, dst_dir / filename)
              item['immagine'] = f'{raw_base}/{filename}'
              done.append((rid, filename, src.stat().st_size))

          recalls_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print('Foto pubblicate:', len(done))
          for rid, filename, size in done:
              print(f' - {rid} -> {filename} ({size} byte)')
          PY

      - name: Verifica URL valorizzati
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids = {
              'mais-pop-corn-2',
              'mais-italiano-pop-corn',
              'mais-italiano-pop-corn-0',
              'mais-pop-corn-3',
          }
          data = json.loads(Path('recalls.json').read_text(encoding='utf-8'))
          found = {
              x.get('id'): x.get('immagine', '')
              for x in data.get('recalls', [])
              if x.get('id') in ids
          }
          if set(found) != ids or any(not v for v in found.values()):
              raise SystemExit(f'Verifica fallita: {found}')
          for rid, url in sorted(found.items()):
              filename = url.rsplit('/', 1)[-1]
              if not (Path('images') / filename).exists():
                  raise SystemExit(f'File non presente per {rid}: {filename}')
          print('✅ Tutte e 4 le foto sono pronte e referenziate')
          PY

      - name: Salva foto nel repository
        run: |
          git config user.name "Richiami Italia Image Bot"
          git config user.email "actions@github.com"
          git add recalls.json images/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Aggiunge foto ai quattro nuovi richiami popcorn"
          git push
