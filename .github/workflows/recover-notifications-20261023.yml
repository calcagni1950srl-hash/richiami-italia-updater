name: Recupera notifiche ottobre 23 - verifica una tantum

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-notifications-20261023.yml"

permissions:
  actions: write
  contents: read

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Avvia monitor ordinario dei richiami nuovi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run notification-watch.yml --repo "$REPO" --ref main
          echo "Monitor dei nuovi richiami avviato; la deduplicazione rimane invariata."
