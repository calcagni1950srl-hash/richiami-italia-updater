name: Controlla qualità immagini richiami

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Aggiorna Database Richiami Italia"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: richiami-image-quality
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa strumenti immagini
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-ita

          python -m pip install pillow numpy opencv-python-headless

          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Controlla sintassi script
        run: |
          python -m py_compile scripts/rebuild_recall_images_v2.py
          python -m py_compile scripts/clean_form_photo_boxes.py
          python -m py_compile scripts/finalize_recall_images.py
          node --check scripts/download_recall_pdfs.mjs

      - name: Scarica PDF ufficiali
        run: node scripts/download_recall_pdfs.mjs

      - name: Estrai foto prodotto ad alta copertura
        run: |
          python scripts/rebuild_recall_images_v2.py
          python scripts/clean_form_photo_boxes.py
          python scripts/finalize_recall_images.py

      - name: Verifica copertura foto prodotto
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path

          data = json.loads(
              Path("recalls.json").read_text(
                  encoding="utf-8"
              )
          )

          recalls = data.get("recalls", [])
          if not recalls:
              raise SystemExit(
                  "ERRORE: recalls.json non contiene richiami"
              )

          with_pdf = 0
          images = 0
          missing = []

          for recall in recalls:
              image = str(
                  recall.get("immagine", "") or ""
              ).strip()
              pdf = str(
                  recall.get("pdfMinistero", "") or ""
              ).strip()

              if pdf:
                  with_pdf += 1

              if image:
                  images += 1
                  if "/images/" not in image:
                      raise SystemExit(
                          "ERRORE: URL immagine non valido per "
                          + str(recall.get("id", ""))
                      )
              elif pdf:
                  missing.append(
                      str(recall.get("id", ""))
                  )

          coverage = images / max(1, with_pdf)

          print("Richiami:", len(recalls))
          print("Richiami con PDF:", with_pdf)
          print("Richiami con foto prodotto:", images)
          print("Richiami senza foto prodotto:", len(missing))
          print("Copertura foto:", f"{coverage:.1%}")

          if missing:
              print("Foto non presente o non recuperabile dal PDF ufficiale:")
              for item in missing:
                  print(" -", item)

          if coverage < 0.90:
              raise SystemExit(
                  "ERRORE: copertura foto inferiore al 90%"
              )

          print("✅ Copertura immagini alta senza forzare fogli o collage")
          PYEOF

      - name: Salva foto prodotto
        run: |
          git config user.name "Richiami Italia Image Bot"
          git config user.email "actions@github.com"

          git add recalls.json images

          if git diff --cached --quiet; then
            echo "Nessuna modifica alle immagini."
          else
            git commit -m "Aggiorna foto prodotto richiami"
            git pull --rebase origin main
            git push
          fi
