name: Controlla qualità immagini richiami

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Aggiorna Database Richiami Italia"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: richiami-image-quality
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Proteggi subito foto validate precedenti
        if: github.event_name == 'workflow_run'
        run: |
          set -e

          git config user.name "Richiami Italia Image Bot"
          git config user.email "actions@github.com"

          cp recalls.json .recalls-current.json

          if ! git show HEAD^:recalls.json > .recalls-previous.json; then
            echo "Nessun database precedente disponibile: salto protezione preventiva."
            rm -f .recalls-current.json .recalls-previous.json
            exit 0
          fi

          rm -rf images
          mkdir -p images

          if git cat-file -e HEAD^:images 2>/dev/null; then
            git archive HEAD^ images | tar -x
          fi

          python - <<'PYEOF'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          current = json.loads(Path('.recalls-current.json').read_text(encoding='utf-8'))
          previous = json.loads(Path('.recalls-previous.json').read_text(encoding='utf-8'))

          previous_by_id = {
              str(item.get('id', '') or '').strip(): item
              for item in previous.get('recalls', [])
              if str(item.get('id', '') or '').strip()
          }

          preserved = 0
          blanked = 0

          for item in current.get('recalls', []):
              rid = str(item.get('id', '') or '').strip()
              old = previous_by_id.get(rid)
              old_url = str((old or {}).get('immagine', '') or '').strip()

              if old_url and '/images/' in old_url:
                  filename = Path(urlparse(old_url).path).name
                  if filename and (Path('images') / filename).exists():
                      item['immagine'] = old_url
                      preserved += 1
                      continue

              # Una foto appena prodotta dal workflow principale non è ancora
              # validata: meglio nessuna foto che far ricomparire quella grezza.
              item['immagine'] = ''
              blanked += 1

          Path('recalls.json').write_text(
              json.dumps(current, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print('Foto validate preservate:', preserved)
          print('Foto nuove lasciate in attesa di validazione:', blanked)
          PYEOF

          rm -f .recalls-current.json .recalls-previous.json

          git add recalls.json images

          if git diff --cached --quiet; then
            echo "Nessuna foto da ripristinare."
          else
            git commit -m "Ripristina foto validate dopo aggiornamento richiami"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa strumenti immagini
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-ita

          python -m pip install pillow numpy opencv-python-headless

          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Controlla sintassi script
        run: |
          python -m py_compile scripts/rebuild_recall_images_v2.py
          python -m py_compile scripts/clean_form_photo_boxes.py
          python -m py_compile scripts/finalize_recall_images.py
          python -m py_compile scripts/restore_missing_recall_images.py
          node --check scripts/download_recall_pdfs.mjs

      - name: Scarica PDF ufficiali
        run: node scripts/download_recall_pdfs.mjs

      - name: Estrai foto prodotto ad alta copertura
        run: |
          python scripts/rebuild_recall_images_v2.py

          rm -rf .quality/images-before-clean
          mkdir -p .quality/images-before-clean
          cp -a images/. .quality/images-before-clean/

          # La vecchia pulizia usava glob "ID-*.png": con ID come
          # amaretti-gallina cancellava anche le foto dei richiami
          # amaretti-gallina-0/-1/-2. La disattiviamo nel runner e la
          # sostituiamo con la pulizia esatta basata sui riferimenti JSON.
          python - <<'PYEOF'
          from pathlib import Path

          path = Path('scripts/clean_form_photo_boxes.py')
          text = path.read_text(encoding='utf-8')
          dangerous = """    for old in IMAGES_DIR.glob(f'{rid}-*.png'):\n        if old.name != filename:\n            old.unlink(missing_ok=True)\n"""
          if dangerous not in text:
              raise SystemExit('ERRORE: blocco di cancellazione per prefisso non trovato')
          text = text.replace(dangerous, '')
          path.write_text(text, encoding='utf-8')
          print('✅ Cancellazione per prefisso ID disattivata')
          PYEOF

          python scripts/clean_form_photo_boxes.py
          python scripts/finalize_recall_images.py
          python scripts/restore_missing_recall_images.py

      - name: Verifica copertura e integrità foto prodotto
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(
              Path("recalls.json").read_text(
                  encoding="utf-8"
              )
          )

          recalls = data.get("recalls", [])
          if not recalls:
              raise SystemExit(
                  "ERRORE: recalls.json non contiene richiami"
              )

          with_pdf = 0
          images = 0
          missing = []
          broken = []

          for recall in recalls:
              rid = str(recall.get("id", "") or "")
              image = str(
                  recall.get("immagine", "") or ""
              ).strip()
              pdf = str(
                  recall.get("pdfMinistero", "") or ""
              ).strip()

              if pdf:
                  with_pdf += 1

              if image:
                  if "/images/" not in image:
                      broken.append((rid, "URL non valido"))
                      continue

                  filename = Path(urlparse(image).path).name
                  local = Path("images") / filename
                  if not filename or not local.exists():
                      broken.append((rid, filename or image))
                      continue

                  images += 1
              elif pdf:
                  missing.append(rid)

          coverage = images / max(1, with_pdf)

          print("Richiami:", len(recalls))
          print("Richiami con PDF:", with_pdf)
          print("Richiami con foto realmente presente:", images)
          print("Richiami senza foto prodotto:", len(missing))
          print("URL immagine senza file:", len(broken))
          print("Copertura foto reale:", f"{coverage:.1%}")

          if missing:
              print("Foto non presente o non recuperabile dal PDF ufficiale:")
              for item in missing:
                  print(" -", item)

          if broken:
              print("ERRORE - URL che puntano a file inesistenti:")
              for rid, filename in broken:
                  print(" -", rid, "->", filename)
              raise SystemExit(
                  "ERRORE: il database contiene URL immagini senza PNG corrispondente"
              )

          if coverage < 0.90:
              raise SystemExit(
                  "ERRORE: copertura foto reale inferiore al 90%"
              )

          print("✅ Foto integre: nessun URL orfano e copertura alta")
          PYEOF

      - name: Salva foto prodotto
        run: |
          git config user.name "Richiami Italia Image Bot"
          git config user.email "actions@github.com"

          # clean_form_photo_boxes.py viene modificato solo temporaneamente
          # nel runner: non deve entrare nel commit né bloccare il rebase.
          git restore scripts/clean_form_photo_boxes.py

          git add recalls.json images

          if git diff --cached --quiet; then
            echo "Nessuna modifica alle immagini."
          else
            git commit -m "Ripara foto richiami e URL immagini"
            git pull --rebase origin main
            git push
          fi
