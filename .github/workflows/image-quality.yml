name: Controlla qualità immagini richiami

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Aggiorna Database Richiami Italia"
    types: [completed]
  schedule:
    - cron: "41 */3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/image-quality.yml"
      - "scripts/image_quality_guard.py"
      - "scripts/rebuild_recall_images_v2.py"
      - "scripts/clean_form_photo_boxes.py"
      - "scripts/finalize_recall_images.py"
      - "scripts/choose_best_recall_photo.py"

permissions:
  contents: write

concurrency:
  # Le immagini non devono aspettare un'acquisizione lunga dei nuovi richiami.
  # In pubblicazione il merge salva SEMPRE i nuovi richiami arrivati nel frattempo.
  group: richiami-image-repair
  cancel-in-progress: false

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Individua soltanto foto mancanti
        id: check
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path("recalls.json").read_text(encoding="utf-8"))
          rows = data.get("recalls", [])
          pending = []
          for item in rows:
              rid = str(item.get("id", "") or "").strip()
              if not rid or not item.get("pdfMinistero"):
                  continue
              url = str(item.get("immagine", "") or "").strip()
              filename = Path(urlparse(url).path).name if url else ""
              if (not re.fullmatch(re.escape(rid) + r"-[a-f0-9]{10}\\.png", filename)
                      or not (Path("images") / filename).is_file()):
                  pending.append(rid)
          print("Richiami totali:", len(rows))
          print("Foto da riparare:", pending)
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as out:
              out.write("repair=" + ("true" if pending else "false") + "\n")
          PY

      - name: Setup Node
        if: steps.check.outputs.repair == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        if: steps.check.outputs.repair == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa strumenti immagini
        if: steps.check.outputs.repair == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-ita

          python -m pip install pillow numpy opencv-python-headless

          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Controlla sintassi script
        if: steps.check.outputs.repair == 'true'
        run: |
          python -m py_compile scripts/rebuild_recall_images_v2.py
          python -m py_compile scripts/clean_form_photo_boxes.py
          python -m py_compile scripts/finalize_recall_images.py
          python -m py_compile scripts/restore_missing_recall_images.py
          python -m py_compile scripts/image_quality_guard.py
          python -m py_compile scripts/choose_best_recall_photo.py
          node --check scripts/download_recall_pdfs.mjs

      - name: Salva foto attualmente validate
        if: steps.check.outputs.repair == 'true'
        run: |
          rm -rf .quality/pre-existing
          mkdir -p .quality/pre-existing/images
          cp recalls.json .quality/pre-existing/recalls.json
          cp -a images/. .quality/pre-existing/images/ 2>/dev/null || true

      - name: Scarica PDF ufficiali
        if: steps.check.outputs.repair == 'true'
        run: node scripts/download_recall_pdfs.mjs

      - name: Estrai e pulisci foto prodotto
        if: steps.check.outputs.repair == 'true'
        run: |
          python scripts/rebuild_recall_images_v2.py

          rm -rf .quality/images-before-clean
          mkdir -p .quality/images-before-clean
          cp -a images/. .quality/images-before-clean/

          python scripts/clean_form_photo_boxes.py
          python scripts/finalize_recall_images.py
          python scripts/restore_missing_recall_images.py

          # Una nuova foto sostituisce quella precedente solo se non è
          # una regressione qualitativa.
          python scripts/image_quality_guard.py select

      - name: Verifica qualità, copertura e integrità
        if: steps.check.outputs.repair == 'true'
        run: |
          python scripts/image_quality_guard.py validate
          python scripts/choose_best_recall_photo.py
          python scripts/image_quality_guard.py validate

      - name: Pubblica solo le immagini senza perdere i nuovi richiami
        if: steps.check.outputs.repair == 'true'
        run: |
          set -e
          python scripts/merge_image_updates.py --self-test

          # Il riparatore puo' essere partito PRIMA di nuovi richiami RSS.
          # Salviamo solo foto/URL, NON il database da sovrascrivere.
          mkdir -p .quality/ready-images
          cp recalls.json .quality/repaired-recalls.json
          cp -a images/. .quality/ready-images/

          git config user.name "Richiami Italia Image Bot"
          git config user.email "actions@github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/merge_image_updates.py \
              .quality/pre-existing/recalls.json \
              .quality/repaired-recalls.json \
              recalls.json \
              .quality/ready-images

            git add recalls.json images
            if git diff --cached --quiet; then
              echo "Nessuna foto nuova: database corrente lasciato intatto."
              exit 0
            fi
            git commit -m "Ripara solo immagini e preserva nuovi richiami"
            if git push origin HEAD:main; then
              echo "Immagini pubblicate senza alterare i nuovi richiami."
              exit 0
            fi
            echo "Conflitto durante la pubblicazione: aggiorno il database remoto."
          done

          echo "Pubblicazione non riuscita dopo tre tentativi"
          exit 1
