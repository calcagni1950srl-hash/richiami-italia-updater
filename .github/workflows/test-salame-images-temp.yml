name: Test mirato foto salame - temporaneo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-salame-images-temp.yml"

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Annulla controllo generale rimasto in coda
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${REPO}/actions/runs/35735071622/cancel" || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ita
          python -m pip install pillow numpy opencv-python-headless
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scarica PDF ufficiali
        run: node scripts/download_recall_pdfs.mjs

      - name: Esegui nuova pulizia
        run: |
          python -m py_compile scripts/clean_form_photo_boxes.py
          python -m py_compile scripts/finalize_recall_images.py
          python scripts/clean_form_photo_boxes.py
          python scripts/finalize_recall_images.py

      - name: Raccogli solo le due foto finali
        run: |
          mkdir -p verifica
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          ids = {
              "salame-stagionato-al-tartufo",
              "salame-stagionato-al-trtufo",
          }
          data=json.loads(Path("recalls.json").read_text(encoding="utf-8"))
          for item in data.get("recalls", []):
              if item.get("id") not in ids:
                  continue
              url=str(item.get("immagine","") or "")
              if not url:
                  raise SystemExit("Foto vuota: "+str(item.get("id")))
              name=url.rsplit("/",1)[-1]
              src=Path("images")/name
              if not src.exists():
                  raise SystemExit("File assente: "+name)
              shutil.copy2(src, Path("verifica")/name)
              print(item.get("id"), "->", name)
          if len(list(Path("verifica").glob("*.png"))) != 2:
              raise SystemExit("Non sono state prodotte esattamente due immagini")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: salame-test-nuova-logica
          path: verifica/

# rerun con ritaglio area fotografica interna
