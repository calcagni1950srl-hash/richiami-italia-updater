name: Manutenzione pianificazione una tantum

on:
  push:
    paths:
      - ".github/workflows/maintenance-once.yml"

permissions:
  contents: write

jobs:
  aggiorna-pianificazione:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta controllo ogni 30 minuti e rimuovi questo workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/update.yml')
          text = path.read_text(encoding='utf-8')
          old = '    - cron: "23 * * * *"'
          new = '    - cron: "7,37 * * * *"'
          if old not in text:
              raise SystemExit('Cron atteso non trovato: nessuna modifica eseguita')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/maintenance-once.yml

      - name: Pubblica modifica
        run: |
          git config user.name "Richiami Italia Bot"
          git config user.email "actions@github.com"
          git add .github/workflows/update.yml .github/workflows/maintenance-once.yml
          git commit -m "Controllo richiami ogni 30 minuti"
          git push
