name: Test protezione ritaglio immagini

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-image-crop-temp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila script immagini
        run: |
          python -m py_compile scripts/rebuild_recall_images_v2.py
          python -m py_compile scripts/clean_form_photo_boxes.py
          python -m py_compile scripts/finalize_recall_images.py
      - name: Estrai e compila estrattore principale
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/update.yml').read_text(encoding='utf-8')
          start_marker = "          cat > estrai.py <<'PYEOF'\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index("\n          PYEOF", start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/estrai.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile /tmp/estrai.py
      - name: Verifica regole anti-taglio
        run: |
          grep -q "guard_x = max(8, int(rgb.width \* 0.025))" .github/workflows/update.yml
          grep -q "pad_x = max(18, int((right - left) \* 0.08))" .github/workflows/update.yml
          grep -q "guard_x=max(8,int(w\*0.035))" scripts/rebuild_recall_images_v2.py
          grep -q "pad_x = max(8, int(bw \* 0.06))" scripts/finalize_recall_images.py
          echo "✅ Regole anti-taglio presenti e sintassi valida"
