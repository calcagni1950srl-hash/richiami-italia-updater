name: Ripara e abilita updater richiami

on:
  push:
    paths:
      - '.github/workflows/repair-enable-update.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Abilita workflow principale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/update.yml/enable"

      - name: Avvia subito workflow principale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}'
