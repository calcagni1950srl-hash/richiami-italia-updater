name: Audit completo Richiami Italia

on:
  push:
    paths:
      - ".github/workflows/audit-completo.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla sintassi Python e JavaScript
        run: |
          python -m compileall -q scripts
          for file in scripts/*.mjs scripts/*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
          echo "✅ Sintassi script valida"

      - name: Installa Pillow per validazione PNG
        run: python -m pip install --quiet pillow

      - name: Audit database immagini e stato notifiche
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from PIL import Image

          recalls = json.loads(Path("recalls.json").read_text(encoding="utf-8"))
          items = recalls.get("recalls", [])
          assert items, "recalls.json vuoto"
          assert recalls.get("totale") == len(items), "totale incoerente"

          pass_count = sum(
              str(x.get("stato", "")).strip().upper() == "PASS"
              for x in items
          )
          assert recalls.get("pass") == pass_count, "conteggio PASS incoerente"
          assert recalls.get("daVerificare") == len(items) - pass_count, "daVerificare incoerente"

          ids = [str(x.get("id", "")).strip() for x in items]
          assert all(ids), "ID vuoto"
          assert len(ids) == len(set(ids)), "ID duplicati"

          image_count = 0
          broken = []
          for item in items:
              rid = str(item.get("id", "")).strip()
              url = str(item.get("immagine", "") or item.get("imageUrl", "") or "").strip()
              if not url:
                  continue
              assert "/images/" in url, f"URL immagine non valido: {rid}"
              filename = Path(urlparse(url).path).name
              local = Path("images") / filename
              if not local.exists():
                  broken.append((rid, filename))
                  continue

              try:
                  with Image.open(local) as im:
                      im.verify()
                  with Image.open(local) as im:
                      w, h = im.size
                      assert w >= 100 and h >= 80, f"PNG troppo piccolo: {rid} {w}x{h}"
                      ratio = max(w, h) / max(1, min(w, h))
                      assert ratio <= 5.5, f"PNG a striscia: {rid} ratio={ratio:.2f}"
                      rgb = im.convert("RGB").resize((64, 64))
                      extrema = rgb.getextrema()
                      spread = sum(hi - lo for lo, hi in extrema)
                      assert spread > 20, f"PNG quasi uniforme/vuoto: {rid}"
              except Exception as exc:
                  raise AssertionError(f"PNG non valido {rid}: {exc}") from exc
              image_count += 1

          assert not broken, f"URL immagini senza file: {broken}"
          coverage = image_count / len(items)
          assert coverage >= 0.90, f"Copertura immagini troppo bassa: {coverage:.1%}"

          state = json.loads(Path("notification-state.json").read_text(encoding="utf-8"))
          notified = [str(x).strip() for x in state.get("notifiedIds", []) if str(x).strip()]
          assert len(notified) == len(set(notified)), "notification-state contiene ID duplicati"

          brie = next((x for x in items if x.get("id") == "brie-tour-de-marze"), None)
          assert brie is not None, "Brie Tour De Marze assente"
          assert str(brie.get("immagine", "")).strip(), "Brie Tour De Marze senza foto"
          assert "brie-tour-de-marze" in notified, "Brie Tour De Marze non segnato come notificato"

          print("Richiami:", len(items))
          print("PASS:", pass_count)
          print("Foto valide:", image_count)
          print("Copertura:", f"{coverage:.1%}")
          print("ID notificati:", len(notified))
          print("✅ Database, immagini e stato notifiche coerenti")
          PY

      - name: Audit configurazione workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          notif = Path(".github/workflows/notification-watch.yml").read_text(encoding="utf-8")
          update = Path(".github/workflows/update.yml").read_text(encoding="utf-8")
          quality = Path(".github/workflows/image-quality.yml").read_text(encoding="utf-8")
          v2 = Path("scripts/rebuild_recall_images_v2.py").read_text(encoding="utf-8")
          cleaner = Path("scripts/clean_form_photo_boxes.py").read_text(encoding="utf-8")
          sender = Path("scripts/send_notification.py").read_text(encoding="utf-8")

          assert 'cron: "2,32 * * * *"' in notif, "Watcher notifiche non impostato ogni 30 minuti"
          assert 'cron: "7,37 * * * *"' in update, "Updater non impostato ogni 30 minuti"
          assert "workflow_run:" not in quality, "Qualità immagini parte ancora dopo ogni updater"
          assert "workflow_dispatch:" in quality, "Qualità immagini non dispatchabile"
          assert "actions: write" in update, "Updater senza permesso per avviare image-quality"
          assert "image-quality.yml/dispatches" in update, "Updater non avvia image-quality dopo aggiornamento completo"
          assert "Installa controllo RSS leggero" not in update, "Updater installa ancora browser nei controlli senza novità"
          assert update.find("Controlla se serve aggiornamento completo") < update.find("Setup Node per aggiornamento completo"), "Node/Playwright partono prima della decisione locale"
          assert "rm -rf images" not in update, "Updater può ancora cancellare tutte le immagini"
          assert "for old in IMAGES_DIR.glob(f'{rid}-*.png')" not in cleaner, "Cancellazione per prefisso ancora presente"
          assert "Foto esistente preservata" in v2, "Generatore immagini non preserva fallback validi"
          assert "referenced=set(accepted)" in v2, "Pulizia immagini non basata sui riferimenti JSON"

          publish_pos = notif.find("Pubblica subito il nuovo richiamo nella lista")
          notify_pos = notif.find("Invia notifica Firebase")
          assert 0 <= publish_pos < notify_pos, "Notifica può partire prima della pubblicazione lista"

          failure_pos = sender.find("if response is None or not response.ok:")
          save_pos = sender.find("save_state(message_id)")
          assert 0 <= failure_pos < save_pos, "Stato notifiche può essere salvato prima di Firebase"

          for wf in (notif, update, quality):
              assert 'node-version: "20"' not in wf, "Workflow usa ancora Node 20 deprecato"

          assert not Path(".github/workflows/repair-enable-update.yml").exists(), "Workflow repair obsoleto ancora presente"

          print("✅ Schedule, concorrenza e protezioni workflow corrette")
          PY

      - name: Simula offline nuovo richiamo
        run: |
          mkdir -p /tmp/recall-sync-test/scripts
          cp scripts/sync_pending_recalls.py /tmp/recall-sync-test/scripts/
          cd /tmp/recall-sync-test

          cat > recalls.json <<'JSON'
          {
            "version": 2,
            "generatedAt": "",
            "source": "Ministero della Salute",
            "feed": "RSS_avvisi_richiami_osa.xml",
            "totale": 1,
            "pass": 1,
            "daVerificare": 0,
            "recalls": [
              {
                "id": "esistente",
                "stato": "PASS"
              }
            ]
          }
          JSON

          cat > notification-pending.json <<'JSON'
          {
            "newItems": [
              {
                "id": "test-nuovo-richiamo",
                "title": "Prodotto Test",
                "pubDate": "18 settembre 2026",
                "link": "https://www.salute.gov.it/new/it/ext-avviso-sicurezza-alimentare/test-nuovo-richiamo"
              }
            ]
          }
          JSON

          python scripts/sync_pending_recalls.py

          python - <<'PY'
          import json
          data=json.load(open("recalls.json",encoding="utf-8"))
          ids=[x["id"] for x in data["recalls"]]
          assert ids.count("test-nuovo-richiamo") == 1
          assert data["totale"] == 2
          item=next(x for x in data["recalls"] if x["id"]=="test-nuovo-richiamo")
          assert item["metodoEstrazione"] == "RSS"
          assert item["criterioMatch"] == "RSS_MINISTERO"
          print("✅ Inserimento provvisorio nuovo richiamo simulato correttamente")
          PY

      - name: Riepilogo audit
        run: |
          echo "============================================"
          echo "✅ AUDIT COMPLETO SUPERATO"
          echo "Nessun accesso al Ministero effettuato dal test"
          echo "Nessuna notifica Firebase di prova inviata"
          echo "============================================"
