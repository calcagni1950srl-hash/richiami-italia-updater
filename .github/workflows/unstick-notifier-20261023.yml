name: Sblocca monitor RSS bloccato - 23 ottobre

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unstick-notifier-20261023.yml"

permissions:
  actions: write
  contents: read

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Libera la coda soltanto se il vecchio monitor sta ancora installando Chromium
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          JOB_ID=120283123139
          RUN_ID=39913955692
          STATUS="$(gh api "repos/${REPO}/actions/jobs/${JOB_ID}" --jq '.status')"
          ACTIVE="$(gh api "repos/${REPO}/actions/jobs/${JOB_ID}" --jq '[.steps[] | select(.status == "in_progress") | .name] | join(",")')"
          echo "Stato vecchio monitor: ${STATUS} - fase: ${ACTIVE}"
          if [[ "${STATUS}" == "in_progress" && "${ACTIVE}" == "Installa dipendenze RSS" ]]; then
            gh run cancel "${RUN_ID}" --repo "${REPO}"
            echo "Vecchio installer bloccato annullato; il monitor aggiornato può procedere."
          else
            echo "Non annullo: il monitor ha cambiato fase, priorita' evitare una notifica interrotta."
          fi
