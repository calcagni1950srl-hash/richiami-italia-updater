name: Revisione temporanea immagini richiami

on:
  push:
    branches:
      - main
    paths:
      - "scripts/rebuild_recall_images_v2.py"
      - "scripts/clean_form_photo_boxes.py"
      - ".github/workflows/review-images-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ita
          python -m pip install pillow numpy opencv-python-headless
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Controlla sintassi
        run: |
          python -m py_compile scripts/rebuild_recall_images_v2.py
          python -m py_compile scripts/clean_form_photo_boxes.py

      - name: Scarica PDF per revisione
        run: node scripts/download_recall_pdfs.mjs

      - name: Genera immagini v2 solo per revisione
        run: |
          python scripts/rebuild_recall_images_v2.py
          python scripts/clean_form_photo_boxes.py

      - name: Carica immagini v2 ripulite
        uses: actions/upload-artifact@v4
        with:
          name: recall-images-v2-clean-review
          path: images/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Carica database v2 ripulito
        uses: actions/upload-artifact@v4
        with:
          name: recalls-v2-clean-review
          path: recalls.json
          retention-days: 1
