name: Notifica immediata nuovi richiami

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/notification-watch.yml"
      - "scripts/notification_fetch.mjs"
      - "scripts/send_notification.py"
      - "scripts/sync_pending_recalls.py"

  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: recall-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze RSS
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Installa dipendenze Firebase
        run: |
          python -m pip install google-auth requests

      - name: Controlla feed Ministero
        run: |
          set +e
          for tentativo in 1 2 3; do
            echo "Tentativo RSS $tentativo/3"
            node scripts/notification_fetch.mjs
            codice=$?
            if [ "$codice" -eq 0 ]; then
              exit 0
            fi
            if [ "$tentativo" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Pubblica subito il nuovo richiamo nella lista
        run: |
          git config user.name "Richiami Italia Notify Bot"
          git config user.email "actions@github.com"

          for tentativo in 1 2 3; do
            echo "Tentativo sincronizzazione lista $tentativo/3"

            git fetch origin main
            git reset --hard origin/main

            python scripts/sync_pending_recalls.py

            git add recalls.json

            if git diff --cached --quiet; then
              echo "Lista richiami già aggiornata."
              exit 0
            fi

            git commit -m "Aggiunge subito nuovo richiamo alla lista"

            if git push origin main; then
              echo "✅ Nuovo richiamo pubblicato nella lista prima della notifica."
              exit 0
            fi

            echo "Push lista non riuscito: rileggo main e riprovo."
          done

          echo "ERRORE: impossibile pubblicare il nuovo richiamo nella lista."
          exit 1

      - name: Invia notifica Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/send_notification.py

      - name: Avvia completamento dettagli del nuovo richiamo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          nuovi="$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path("notification-result.json")
          data=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          print(int(data.get("sentCount", 0) or 0))
          PY
          )"

          if [ "$nuovi" -le 0 ]; then
            echo "Nessun nuovo richiamo: updater completo non avviato."
            exit 0
          fi

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "✅ Aggiornamento completo avviato una sola volta per il nuovo richiamo."

      - name: Salva stato notifiche
        run: |
          git config user.name "Richiami Italia Notify Bot"
          git config user.email "actions@github.com"

          git add notification-state.json

          if git diff --cached --quiet; then
            echo "Stato notifiche invariato."
            exit 0
          fi

          git commit -m "Aggiorna stato notifiche richiami"

          for tentativo in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "✅ Stato notifiche salvato."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "Salvataggio stato non riuscito, tentativo $tentativo/3."
            sleep 3
          done

          echo "ERRORE: impossibile salvare notification-state.json."
          exit 1
