name: Notifica immediata nuovi richiami

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/notification-watch.yml"
      - "scripts/notification_fetch.mjs"
      - "scripts/send_notification.py"
      - "scripts/sync_pending_recalls.py"

  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: recall-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze RSS
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Installa dipendenze Firebase
        run: |
          python -m pip install google-auth requests

      - name: Controlla feed Ministero
        run: |
          set +e
          for tentativo in 1 2 3; do
            echo "Tentativo RSS $tentativo/3"
            node scripts/notification_fetch.mjs
            codice=$?
            if [ "$codice" -eq 0 ]; then
              exit 0
            fi
            if [ "$tentativo" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Completa il nuovo richiamo prima della notifica
        id: completa
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          nuovi="$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path("notification-result.json")
          data=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          print(int(data.get("firstAttemptCount", 0) or 0))
          PY
          )"

          if [ "$nuovi" -le 0 ]; then
            echo "Nessun nuovo richiamo: completamento non necessario."
            echo "update_result=not_needed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Avvio updater completo alle $started_at"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}'

          STARTED_AT="$started_at" python - <<'PY'
          import datetime as dt
          import os
          import time
          import requests

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          started = dt.datetime.fromisoformat(
              os.environ["STARTED_AT"].replace("Z", "+00:00")
          )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          session = requests.Session()
          session.headers.update(headers)

          run_id = None
          deadline = time.time() + 15 * 60

          while time.time() < deadline and run_id is None:
              response = session.get(
                  f"https://api.github.com/repos/{repo}/actions/runs",
                  params={"event": "workflow_dispatch", "per_page": 20},
                  timeout=30,
              )
              response.raise_for_status()

              candidates = []
              for run in response.json().get("workflow_runs", []):
                  if run.get("name") != "Aggiorna Database Richiami Italia":
                      continue
                  created_raw = str(run.get("created_at", "") or "")
                  try:
                      created = dt.datetime.fromisoformat(
                          created_raw.replace("Z", "+00:00")
                      )
                  except ValueError:
                      continue
                  if created >= started - dt.timedelta(seconds=5):
                      candidates.append((created, int(run["id"])))

              if candidates:
                  candidates.sort(reverse=True)
                  run_id = candidates[0][1]
                  print("Updater individuato:", run_id)
                  break

              time.sleep(5)

          result = "timeout"

          if run_id is not None:
              while time.time() < deadline:
                  response = session.get(
                      f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                      timeout=30,
                  )
                  response.raise_for_status()
                  run = response.json()

                  if run.get("status") == "completed":
                      result = str(run.get("conclusion") or "failure")
                      print("Updater concluso:", result)
                      break

                  time.sleep(10)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"update_result={result}\n")
          PY

      - name: Invia notifica Firebase
        if: >-
          steps.completa.outputs.update_result == 'success' ||
          steps.completa.outputs.update_result == 'not_needed'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "Esito completamento richiamo: ${{ steps.completa.outputs.update_result }}"
          python scripts/send_notification.py

      - name: Non notificare schede incomplete
        if: >-
          steps.completa.outputs.update_result != 'success' &&
          steps.completa.outputs.update_result != 'not_needed'
        run: |
          echo "⚠️ Completamento richiamo non riuscito: notifica rimandata al prossimo controllo."

      - name: Salva stato notifiche
        run: |
          git config user.name "Richiami Italia Notify Bot"
          git config user.email "actions@github.com"

          # Conserva LO STATO GENERATO DA QUESTO RUN prima di aggiornare
          # la working tree. La vecchia versione lo cancellava con checkout,
          # quindi lo stesso richiamo risultava nuovo al controllo successivo.
          cp notification-state.json /tmp/notification-state.generated.json

          for tentativo in 1 2 3; do
            git reset --hard HEAD
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "Aggiornamento base non riuscito, tentativo $tentativo/3."
              sleep 3
              continue
            fi

            python - <<'PY'
          import json
          from pathlib import Path

          remote_path = Path("notification-state.json")
          generated_path = Path("/tmp/notification-state.generated.json")

          remote = json.loads(remote_path.read_text(encoding="utf-8")) if remote_path.exists() else {}
          generated = json.loads(generated_path.read_text(encoding="utf-8"))

          ids = set(remote.get("notifiedIds", []) or [])
          ids.update(generated.get("notifiedIds", []) or [])
          generated["notifiedIds"] = sorted(str(x) for x in ids if str(x).strip())
          generated["version"] = max(int(remote.get("version", 0) or 0), int(generated.get("version", 3) or 3))

          remote_checked = str(remote.get("lastCheckedAt", "") or "")
          generated_checked = str(generated.get("lastCheckedAt", "") or "")
          if remote_checked > generated_checked:
              generated["lastCheckedAt"] = remote_checked

          remote_notification = str(remote.get("lastNotificationAt", "") or "")
          generated_notification = str(generated.get("lastNotificationAt", "") or "")
          if remote_notification > generated_notification:
              for key in ("lastNotificationAt", "lastNotificationIds", "lastFirebaseMessageId"):
                  if key in remote:
                      generated[key] = remote[key]

          remote_path.write_text(json.dumps(generated, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY

            git add notification-state.json
            if git diff --cached --quiet; then
              echo "Stato notifiche già aggiornato."
              exit 0
            fi

            git commit -m "Aggiorna stato notifiche richiami"

            if git push origin main; then
              echo "✅ Stato notifiche salvato senza perdere gli ID notificati."
              exit 0
            fi

            echo "Salvataggio stato non riuscito, tentativo $tentativo/3."
            sleep 3
          done

          echo "ERRORE: impossibile salvare notification-state.json."
          exit 1
