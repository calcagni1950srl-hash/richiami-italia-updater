name: Pubblica foto salame validate - temporaneo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-salame-good-temp.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica le due foto validate visivamente
        uses: actions/download-artifact@v4
        with:
          name: salame-test-nuova-logica
          path: artifact
          run-id: 35736256082
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica solo le immagini approvate dal test completo
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          mapping = {
              "salame-stagionato-al-tartufo":
                  "salame-stagionato-al-tartufo-d77d77fc4d.png",
              "salame-stagionato-al-trtufo":
                  "salame-stagionato-al-trtufo-7c75068da8.png",
          }

          data_path = Path("recalls.json")
          data = json.loads(data_path.read_text(encoding="utf-8"))
          by_id = {
              str(x.get("id", "") or "").strip(): x
              for x in data.get("recalls", [])
          }

          src_root = Path("artifact")
          dst_root = Path("images")
          dst_root.mkdir(parents=True, exist_ok=True)

          base = (
              "https://raw.githubusercontent.com/"
              "calcagni1950srl-hash/richiami-italia-updater/"
              "refs/heads/main/images/"
          )

          for rid, filename in mapping.items():
              item = by_id.get(rid)
              if item is None:
                  raise SystemExit("Richiamo assente: " + rid)

              matches = list(src_root.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(
                      f"Atteso un file {filename}, trovati {len(matches)}"
                  )

              src = matches[0]
              if src.stat().st_size < 10000:
                  raise SystemExit("Immagine troppo piccola: " + filename)

              shutil.copy2(src, dst_root / filename)
              item["immagine"] = base + filename
              print("✅", rid, "->", filename)

          referenced = {
              str(x.get("immagine", "") or "").rsplit("/", 1)[-1]
              for x in data.get("recalls", [])
              if str(x.get("immagine", "") or "").strip()
          }

          for path in dst_root.glob("salame-stagionato-*.png"):
              if path.name not in referenced:
                  path.unlink(missing_ok=True)

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verifica file e URL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ids = {
              "salame-stagionato-al-tartufo":
                  "salame-stagionato-al-tartufo-d77d77fc4d.png",
              "salame-stagionato-al-trtufo":
                  "salame-stagionato-al-trtufo-7c75068da8.png",
          }

          data=json.loads(Path("recalls.json").read_text(encoding="utf-8"))
          by_id={x.get("id"):x for x in data.get("recalls",[])}

          for rid, filename in ids.items():
              url=str(by_id[rid].get("immagine","") or "")
              if not url.endswith("/"+filename):
                  raise SystemExit(f"URL errato {rid}: {url}")
              if not (Path("images")/filename).exists():
                  raise SystemExit(f"File assente: {filename}")

          print("✅ Entrambe le foto salame validate sono pronte")
          PY

      - name: Salva
        run: |
          git config user.name "Richiami Italia Image Bot"
          git config user.email "actions@github.com"
          git add recalls.json images
          git commit -m "Pubblica foto complete dei due salami"
          git push
